<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica — Overlay</title><link rel="stylesheet" href="/overlay-style"><style>html,body{margin:0;width:100%;height:100%;background:transparent}</style></head><body><div id="overlay" class="verifica-overlay"></div><script type="module">
import{createOverlay}from'/overlay-client.js';
const mode=new URLSearchParams(location.search),overlay=createOverlay(document.getElementById('overlay'),{preview:mode.get('preview')==='1'});
if(mode.get('demo')==='1')overlay.setDemo(true);
else{const events=new EventSource('/api/events');events.onmessage=e=>{const v=JSON.parse(e.data);if(v.type==='snapshot')overlay.render(v.state);};events.onerror=()=>overlay.hide();}
</script></body></html>
